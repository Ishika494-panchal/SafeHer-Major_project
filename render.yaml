services:
  # ── Backend: Express / Node.js ──────────────────────────────────────────────
  - type: web
    name: safeher-backend
    runtime: node
    rootDir: Backend
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        sync: false   # Set this to your Render frontend URL after first deploy
      - key: TEXTBEE_API_KEY
        sync: false   # Set in Render dashboard
      - key: TEXTBEE_DEVICE_ID
        sync: false   # Set in Render dashboard
      - key: ADMIN_EMAILS
        sync: false   # Optional: comma-separated admin email list

  # ── Frontend: React / Vite (Static Site) ────────────────────────────────────
  - type: web
    name: safeher-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_BACKEND_URL
        sync: false   # Set to your backend Render URL, e.g. https://safeher-backend.onrender.com
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
